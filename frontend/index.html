<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Podcast Episode Notes</title><link rel="stylesheet" href="styles.css"></head><body><header><h1>Podcast Episode Notes</h1><p>Find a podcast episode, save it, and write timestamped notes.</p><span id="who">Signed out</span></header><main><section class="panel"><h2>1. Sign in / create account</h2><form id="auth"><input type="email" id="email" placeholder="Email" required><input type="password" id="password" placeholder="Password (12+ characters)" required minlength="12"><button type="button" id="register">Register</button><button type="submit">Sign in</button><button type="button" id="signout">Sign out</button></form></section><section class="panel"><h2>2. Discover episodes</h2><form id="search"><input id="term" required minlength="2" placeholder="Search e.g. cloud computing"><button>Search iTunes</button></form><div id="results"></div></section><section class="panel"><h2>3. My library</h2><button id="reloadLibrary">Refresh library</button><div id="library"></div><p id="stats"></p></section><section class="panel"><h2>4. Notes</h2><form id="noteForm"><input id="noteEpisode" placeholder="Saved episode ID" required><input id="noteTitle" placeholder="Note title" required><textarea id="noteBody" placeholder="Write something useful" required></textarea><input type="number" id="noteTime" placeholder="Timestamp in seconds" min="0" required><select id="noteTag"><option value="">No tag</option></select><button>Create timestamped note</button></form><div class="row"><input id="noteSearch" placeholder="Find in my notes"><button id="reloadNotes">Search notes</button></div><div id="notes"></div></section><section class="panel"><h2>5. Organise tags</h2><form id="tagForm"><input id="tagName" placeholder="Tag name" maxlength="35" required><button>Create tag</button></form><div id="tags"></div></section><section class="panel"><h2>Administrator moderation</h2><p>Admin-only backend action: block or approve imported episodes.</p><div class="row"><input id="adminEpisode" placeholder="Episode ID"><select id="adminStatus"><option value="blocked">Block</option><option value="approved">Approve</option></select><button id="adminReview">Apply review</button></div></section><section class="panel"><h2>Activity</h2><pre id="message" aria-live="polite">Ready.</pre></section></main><script src="config.js"></script><script src="app.js"></script></body></html>
